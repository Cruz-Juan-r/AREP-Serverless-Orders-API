# Architecture A: API Gateway REST API with non-proxy (custom) Lambda integrations.
# API Gateway routes, builds the Lambda input with mapping templates (VTL) and
# chooses the HTTP status by matching the Lambda errorMessage against regular expressions.
# __PLACEHOLDERS__ are replaced by infra/deploy.sh.
openapi: 3.0.1
info:
  title: orders-api-mapping
  version: "1.0"
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Order created }
        "400": { description: Invalid request }
        "500": { description: Unexpected error }
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        uri: arn:aws:apigateway:__REGION__:lambda:path/2015-03-31/functions/__CREATE_ORDER_ARN__/invocations
        # A Content-Type without a template is rejected with 415 instead of reaching Lambda.
        passthroughBehavior: when_no_templates
        requestTemplates:
          application/json: |
            $input.json('$')
        responses:
          default:
            statusCode: "201"
          '.*"error":"INVALID_REQUEST".*':
            statusCode: "400"
            responseTemplates:
              application/json: "$input.path('$.errorMessage')"
          '(?s)(?!.*"error":"(ORDER_NOT_FOUND|INVALID_REQUEST)").+':
            statusCode: "500"
            responseTemplates:
              application/json: '{"error":"INTERNAL_ERROR","message":"An unexpected error occurred"}'

    get:
      operationId: findOrdersByCustomer
      parameters:
        - name: customerId
          in: query
          required: false   # validated by the application, so the error follows our JSON format
          schema: { type: string }
      responses:
        "200": { description: Orders of the customer (possibly empty) }
        "400": { description: Missing customerId }
        "500": { description: Unexpected error }
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        uri: arn:aws:apigateway:__REGION__:lambda:path/2015-03-31/functions/__FIND_ORDERS_ARN__/invocations
        passthroughBehavior: when_no_templates
        requestTemplates:
          application/json: |
            {
              "customerId": "$util.escapeJavaScript($input.params('customerId'))"
            }
        responses:
          default:
            statusCode: "200"
          '.*"error":"INVALID_REQUEST".*':
            statusCode: "400"
            responseTemplates:
              application/json: "$input.path('$.errorMessage')"
          '(?s)(?!.*"error":"(ORDER_NOT_FOUND|INVALID_REQUEST)").+':
            statusCode: "500"
            responseTemplates:
              application/json: '{"error":"INTERNAL_ERROR","message":"An unexpected error occurred"}'

  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: The order }
        "400": { description: Blank id }
        "404": { description: Order not found }
        "500": { description: Unexpected error }
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        uri: arn:aws:apigateway:__REGION__:lambda:path/2015-03-31/functions/__GET_ORDER_ARN__/invocations
        passthroughBehavior: when_no_templates
        requestTemplates:
          application/json: |
            {
              "id": "$util.escapeJavaScript($input.params('id'))"
            }
        responses:
          default:
            statusCode: "200"
          '.*"error":"ORDER_NOT_FOUND".*':
            statusCode: "404"
            responseTemplates:
              application/json: "$input.path('$.errorMessage')"
          '.*"error":"INVALID_REQUEST".*':
            statusCode: "400"
            responseTemplates:
              application/json: "$input.path('$.errorMessage')"
          '(?s)(?!.*"error":"(ORDER_NOT_FOUND|INVALID_REQUEST)").+':
            statusCode: "500"
            responseTemplates:
              application/json: '{"error":"INTERNAL_ERROR","message":"An unexpected error occurred"}'
